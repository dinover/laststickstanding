<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Last Stick Standing</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #0b0d12;
    color: #eee;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .box { text-align: center; max-width: 420px; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { color: #aaa; line-height: 1.5; margin: 0 0 20px; }
  button {
    background: #e8453c; color: #fff; border: none;
    padding: 10px 22px; font-size: 15px; border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: #ff5a50; }
</style>
</head>
<body>
  <div class="box">
    <h1>No se pudo entrar a la pelea</h1>
    <p>Fijate tu conexión y probá de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
