<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Last One Standing — Controller</title>
<link rel="stylesheet" href="https://freeconsole.vercel.app/console.css" />
<style>
  * { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    position: relative; touch-action: none; overscroll-behavior: none;
    --me: var(--glow);
  }

  /* -------- corner status badge (kept tiny so it never competes with the buttons) -------- */
  #badge {
    position: absolute; top: max(8px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left));
    display: flex; align-items: center; gap: 7px; z-index: 5; pointer-events: none;
  }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--me); box-shadow: 0 0 10px var(--me); flex-shrink: 0; }
  #badge .name { font-weight: 700; font-size: 12px; }
  #badge .status { color: var(--text-faint); font-size: 10px; }
  #muteToggle {
    pointer-events: auto; width: 26px; height: 26px; border-radius: 50%; margin-left: 4px;
    border: 1px solid var(--line); background: rgba(10,12,24,.6); color: var(--text-dim); font-size: 12px;
  }
  #muteToggle.active { color: var(--hot); border-color: var(--hot); }

  /* -------- game controls: full-screen, split left (move) / right (actions) -------- */
  #controls {
    display: none; position: absolute; inset: 0; padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    gap: 14px;
  }
  #controls.show { display: flex; }
  /* Each zone gets half the width and its buttons split that evenly via flex, so nothing
     ever overflows or gets clipped regardless of how narrow the phone is. */
  .zone { flex: 1 1 0; min-width: 0; display: flex; gap: 10px; }
  /* Jump sits above punch, stacked, rather than side by side. */
  .zone.action { flex-direction: column; }
  .padBtn {
    flex: 1 1 0; min-width: 0; min-height: 0; max-width: 260px; height: 100%; border-radius: 22px; border: 2px solid var(--line);
    background: linear-gradient(155deg, #1a2038, #0a0c18);
    display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: clamp(12px, 3vw, 15px);
    color: var(--text-dim); position: relative; overflow: hidden;
  }
  .zone.action .padBtn { max-width: none; width: 100%; }
  .padBtn .glyph { font-size: 30px; line-height: 1; }
  .padBtn.down { transform: scale(.97); border-color: var(--me); box-shadow: inset 0 0 40px color-mix(in srgb, var(--me) 25%, transparent); color: var(--me); }
  #punchBtn { background: linear-gradient(155deg, #2a1030, #180a18); }
  #punchBtn.down { border-color: var(--hot); color: var(--hot); box-shadow: inset 0 0 40px color-mix(in srgb, var(--hot) 25%, transparent); }
  #jumpBtn.down { border-color: var(--amber); color: var(--amber); }

  /* -------- host panel / wait panel: a compact floating card, not a full-width block,
     so the movement and action buttons stay reachable underneath it -------- */
  #hostPanel, #waitPanel {
    display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 10; background: rgba(10,12,24,.92); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px;
    width: min(78vw, 320px); text-align: center;
  }
  #hostPanel { flex-direction: column; align-items: center; gap: 10px; }
  #hostPanel.show { display: flex; }
  #hostPanel .lbl { font-size: 11px; color: var(--text-dim); letter-spacing: .1em; }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--ink-600);
    color: var(--text); font-size: 20px; font-family: var(--font-display);
  }
  .stepper .n { font-family: var(--font-mono); font-size: 24px; color: var(--glow); width: 44px; text-align: center; }
  #snailRow { display: flex; align-items: center; gap: 10px; }
  #snailToggle {
    width: 46px; height: 26px; border-radius: 999px; border: 1px solid var(--line); background: var(--ink-600);
    position: relative; flex: none;
  }
  #snailToggle::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--text-dim); transition: transform .15s ease, background .15s ease;
  }
  #snailToggle.on { border-color: var(--glow); }
  #snailToggle.on::after { transform: translateX(20px); background: var(--glow); }
  #startBtn {
    width: 100%; padding: 11px; border-radius: 999px; border: none; background: var(--hot); color: #fff;
    font-family: var(--font-display); font-weight: 700; font-size: 14px; box-shadow: var(--bloom-hot);
  }
  #waitPanel.show { display: block; color: var(--text-dim); font-size: 12px; }

  #deadOverlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
    background: rgba(5,6,13,.82); z-index: 30; text-align: center;
  }
  #deadOverlay.show { display: flex; }
  #deadOverlay .big { font-family: var(--font-display); font-size: 22px; color: var(--hot); text-shadow: var(--bloom-hot); }
  #deadOverlay .small { color: var(--text-dim); font-size: 12px; }

  #fightFlash {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 25; pointer-events: none;
  }
  #fightFlash.show { display: flex; }
  #fightFlash span { font-family: var(--font-display); font-weight: 900; font-size: 30px; color: var(--hot); text-shadow: var(--bloom-hot); }

  #finalOverlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 8px; z-index: 30;
    background: var(--ink-900); text-align: center; padding: 16px;
  }
  #finalOverlay.show { display: flex; }
  #finalOverlay .pos { font-family: var(--font-marquee); font-size: 28px; color: var(--amber); text-shadow: 0 0 16px rgba(255,194,71,.5); }
  #finalOverlay .pts { color: var(--text-dim); font-size: 12px; }
  #playAgainBtn { margin-top: 8px; padding: 11px 26px; border-radius: 999px; border: none; background: var(--glow); color: #05060d; font-family: var(--font-display); font-weight: 700; display: none; }
  #playAgainBtn.show { display: block; }

  /* -------- rotate prompt: this game is landscape-only, since two-thumb fighting
     controls don't fit a tall narrow screen. We can't force a real device rotation from
     inside a sandboxed iframe, so we ask instead — and block input until it happens. -------- */
  #rotatePrompt {
    display: none; position: fixed; inset: 0; z-index: 100; background: var(--ink-900);
    flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px;
  }
  #rotatePrompt .icon { width: 56px; height: 56px; border: 3px solid var(--glow); border-radius: 8px; position: relative; animation: rotateHint 1.8s ease-in-out infinite; box-shadow: var(--bloom-glow); }
  #rotatePrompt .icon::after { content: ""; position: absolute; inset: 10px 20px; border-top: 3px solid var(--glow); }
  @keyframes rotateHint { 0%, 15% { transform: rotate(0deg); } 50%, 65% { transform: rotate(-90deg); } 100% { transform: rotate(-90deg); } }
  #rotatePrompt p { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--text); margin: 0; max-width: 220px; }
  @media (orientation: portrait) {
    #rotatePrompt { display: flex; }
  }
</style>
</head>
<body>
<div class="atmosphere"></div>

<div id="badge">
  <div class="dot" id="dot"></div>
  <div>
    <div class="name" id="nm">Jugador</div>
    <div class="status" id="status">Conectando…</div>
  </div>
  <button id="muteToggle" title="Silenciar">♪</button>
</div>

<div id="controls">
  <div class="zone move">
    <button class="padBtn" id="leftBtn"><span class="glyph">◀</span></button>
    <button class="padBtn" id="rightBtn"><span class="glyph">▶</span></button>
  </div>
  <div class="zone action">
    <button class="padBtn" id="jumpBtn">SALTAR</button>
    <button class="padBtn" id="punchBtn">GOLPEAR</button>
  </div>
</div>

<div id="hostPanel">
  <div class="lbl">CANTIDAD DE RONDAS</div>
  <div class="stepper">
    <button id="minusBtn">−</button>
    <div class="n" id="roundsN">3</div>
    <button id="plusBtn">+</button>
  </div>
  <div id="snailRow">
    <button id="snailToggle" role="switch" aria-checked="false"></button>
    <div class="lbl" style="letter-spacing:normal; text-align:left;">Modo caracol<br><span style="opacity:.7">para TVs lentas</span></div>
  </div>
  <button id="startBtn">Comenzar partida</button>
</div>
<div id="waitPanel">Esperando a que el host inicie la partida… (<span id="roundsPreview">3</span> rondas)</div>

<div id="fightFlash"><span>¡FIGHT!</span></div>
<div id="deadOverlay"><div class="big">ELIMINADO</div><div class="small">Mirando el resto de la ronda…</div></div>
<div id="finalOverlay">
  <div class="pos" id="finalPos">—</div>
  <div class="pts" id="finalPts"></div>
  <button id="playAgainBtn">Jugar de nuevo</button>
</div>

<div id="rotatePrompt">
  <div class="icon"></div>
  <p>Girá tu teléfono de costado para jugar</p>
</div>

<script src="https://freeconsole.vercel.app/sdk.js"></script>
<script src="audio.js"></script>
<script>
(function () {
  "use strict";
  AudioManager.armUnlock();
  var ac = new FreeConsole({ orientation: FreeConsole.ORIENTATION_LANDSCAPE });
  var myColor = "#35f0e0";
  var isMaster = false;
  var rounds = 3;
  var snailMode = false;
  var lastPhase = "lobby";

  function setMe() {
    myColor = ac.getPlayerColor();
    document.body.style.setProperty("--me", myColor);
    document.getElementById("nm").textContent = ac.getNickname();
  }

  function updateMasterUI() {
    isMaster = ac.getDeviceId() === ac.getMasterControllerDeviceId();
    document.getElementById("hostPanel").classList.toggle("show", isMaster && lastPhase === "lobby");
    document.getElementById("waitPanel").classList.toggle("show", !isMaster && lastPhase === "lobby");
  }

  document.getElementById("minusBtn").addEventListener("click", function () {
    AudioManager.on.uiClick();
    rounds = Math.max(1, rounds - 1);
    document.getElementById("roundsN").textContent = rounds;
  });
  document.getElementById("plusBtn").addEventListener("click", function () {
    AudioManager.on.uiClick();
    rounds = Math.min(20, rounds + 1);
    document.getElementById("roundsN").textContent = rounds;
  });
  document.getElementById("snailToggle").addEventListener("click", function () {
    AudioManager.on.uiClick();
    snailMode = !snailMode;
    this.classList.toggle("on", snailMode);
    this.setAttribute("aria-checked", String(snailMode));
  });
  document.getElementById("startBtn").addEventListener("click", function () {
    AudioManager.on.uiClick();
    ac.message(FreeConsole.SCREEN, { t: "start", rounds: rounds, snail: snailMode });
  });
  document.getElementById("playAgainBtn").addEventListener("click", function () {
    AudioManager.on.uiClick();
    ac.message(FreeConsole.SCREEN, { t: "restart" });
  });

  /* -------- movement / action buttons -------- */
  function bindHold(el, key) {
    var active = false;
    function down(e) {
      e.preventDefault();
      if (active) return;
      active = true;
      el.classList.add("down");
      ac.message(FreeConsole.SCREEN, { t: "in", k: key, d: true });
      if (navigator.vibrate) navigator.vibrate(8);
    }
    function up(e) {
      if (e) e.preventDefault();
      if (!active) return;
      active = false;
      el.classList.remove("down");
      ac.message(FreeConsole.SCREEN, { t: "in", k: key, d: false });
    }
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener("pointerleave", up);
  }
  bindHold(document.getElementById("leftBtn"), "left");
  bindHold(document.getElementById("rightBtn"), "right");
  bindHold(document.getElementById("jumpBtn"), "jump");
  bindHold(document.getElementById("punchBtn"), "punch");

  /* -------- mute toggle -------- */
  (function () {
    var btn = document.getElementById("muteToggle");
    var muted = AudioManager.getSettings().muted;
    btn.classList.toggle("active", muted);
    btn.addEventListener("click", function () {
      muted = !muted;
      AudioManager.setMuted(muted);
      btn.classList.toggle("active", muted);
    });
  })();

  /* -------- SDK callbacks -------- */
  ac.onReady = function () {
    setMe();
    document.getElementById("status").textContent = "Conectado";
    document.getElementById("controls").classList.add("show");
    updateMasterUI();
  };
  ac.onConnect = function () { updateMasterUI(); };
  ac.onDisconnect = function () { updateMasterUI(); };

  ac.onMessage = function (device_id, data) {
    if (!data) return;
    if (data.t === "roundsPreview") {
      document.getElementById("roundsPreview").textContent = data.n;
      return;
    }
    if (data.t === "phase") {
      lastPhase = data.phase;
      document.getElementById("roundsPreview").textContent = data.rounds;
      if (!isMaster) document.getElementById("roundsN").textContent = data.rounds;
      updateMasterUI();

      var deadOv = document.getElementById("deadOverlay");
      var finalOv = document.getElementById("finalOverlay");
      var flash = document.getElementById("fightFlash");

      if (data.phase === "fightIntro") {
        flash.classList.add("show");
        setTimeout(function () { flash.classList.remove("show"); }, 900);
        deadOv.classList.remove("show");
        finalOv.classList.remove("show");
      } else if (data.phase === "fight") {
        var amAlive = data.alive.indexOf(ac.getDeviceId()) !== -1;
        deadOv.classList.toggle("show", !amAlive);
        finalOv.classList.remove("show");
      } else if (data.phase === "roundEnd") {
        // keep dead overlay state as-is briefly
      } else if (data.phase === "lobby") {
        deadOv.classList.remove("show");
        finalOv.classList.remove("show");
      } else if (data.phase === "final") {
        deadOv.classList.remove("show");
        document.getElementById("playAgainBtn").classList.toggle("show", isMaster);
        finalOv.classList.add("show");
      }
    }
  };
})();
</script>
</body>
</html>
