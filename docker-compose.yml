services:
  app:
    build:
      context: .
      # en la VM (poca RAM) se usa Dockerfile.prebuilt vía LSS_DOCKERFILE en .env; ver scripts/deploy-vm.sh
      dockerfile: ${LSS_DOCKERFILE:-Dockerfile}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8080
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
