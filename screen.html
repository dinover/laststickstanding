<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Last One Standing — Screen</title>
<link rel="stylesheet" href="https://freeconsole.vercel.app/console.css" />
<style>
  html, body { height: 100%; overflow: hidden; background: #05060d; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #05060d; box-shadow: 0 0 80px rgba(53,240,224,.08); }

  #topbar {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 5; pointer-events: none;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; position: relative;
    border: 2px solid rgba(255,255,255,.25); box-shadow: 0 0 12px currentColor;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 11px; color: #05060d; font-weight: 700;
    transition: opacity .3s;
  }
  .avatar.out { opacity: .35; }
  .avatar .x {
    position: absolute; inset: -4px; display: none; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 900; font-size: 30px; color: #ff2e88;
    text-shadow: 0 0 10px #ff2e88, 0 0 2px #000;
  }
  .avatar.out .x { display: flex; }

  #room {
    position: absolute; top: 14px; left: 18px; z-index: 5;
    font-family: var(--font-mono); color: var(--text-dim); font-size: 13px;
    letter-spacing: .08em;
  }
  #room b { color: var(--glow); }

  #overlay {
    position: absolute; inset: 0; z-index: 10; pointer-events: none;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
  }
  #fightText {
    font-family: var(--font-display); font-weight: 900; font-size: 96px;
    color: var(--hot); text-shadow: var(--bloom-hot); opacity: 0; letter-spacing: .05em;
    transform: scale(.6);
  }
  #fightText.show { animation: fightPop .9s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes fightPop {
    0% { opacity: 0; transform: scale(.4) rotate(-4deg); }
    35% { opacity: 1; transform: scale(1.15) rotate(2deg); }
    60% { transform: scale(1) rotate(0); }
    85% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.3); }
  }

  #roundBanner {
    position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-mono); color: var(--text); font-size: 15px;
    background: rgba(10,12,24,.6); padding: 4px 14px; border-radius: 999px;
    border: 1px solid var(--line); letter-spacing: .1em; z-index: 5;
    display: none;
  }
  #roundBanner.show { display: block; }

  #lobbyPanel {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    text-align: center; z-index: 6; font-family: var(--font-display);
  }
  #lobbyPanel h2 { margin: 0 0 4px; color: var(--glow); text-shadow: var(--bloom-glow); font-size: 26px; }
  #lobbyPanel p { margin: 0; color: var(--text-dim); font-size: 14px; }
  #lobbyPanel.hide { display: none; }

  #finalScreen {
    position: absolute; inset: 0; z-index: 20; display: none;
    background: radial-gradient(circle at 50% 30%, rgba(53,240,224,.08), transparent 60%), var(--ink-900);
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  }
  #finalScreen.show { display: flex; }
  #finalScreen h1 {
    font-family: var(--font-marquee); font-size: 42px; color: var(--amber);
    text-shadow: 0 0 20px rgba(255,194,71,.6); margin: 0;
  }
  #ranking { display: flex; flex-direction: column; gap: 8px; width: 420px; }
  .rankRow {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: var(--radius-sm);
    font-family: var(--font-display); color: var(--text);
  }
  .rankRow .pos { font-family: var(--font-mono); color: var(--text-faint); width: 24px; }
  .rankRow .dot { width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
  .rankRow .nm { flex: 1; }
  .rankRow .sc { font-family: var(--font-mono); color: var(--glow); }
  .rankRow.win { border-color: var(--amber); box-shadow: 0 0 18px rgba(255,194,71,.25); }
  #dancer { width: 140px; height: 160px; }

  #audioPanel {
    position: absolute; top: 14px; right: 18px; z-index: 6;
    font-family: var(--font-mono); color: var(--text-dim); font-size: 11px;
  }
  #audioToggle {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
    background: rgba(10,12,24,.6); color: var(--text-dim); cursor: pointer; font-size: 15px;
  }
  #audioMenu {
    display: none; position: absolute; top: 42px; right: 0; width: 190px;
    background: rgba(10,12,24,.92); border: 1px solid var(--line); border-radius: var(--radius-sm, 10px);
    padding: 12px 14px; backdrop-filter: blur(8px);
  }
  #audioMenu.show { display: block; }
  #audioMenu label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; letter-spacing: .04em; }
  #audioMenu label span { width: 46px; flex-shrink: 0; }
  #audioMenu input[type="range"] { flex: 1; accent-color: var(--glow); }
  #audioMenu .muteRow { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
  #audioMenu button#muteBtn {
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
    border-radius: 999px; padding: 4px 10px; font-family: var(--font-mono); font-size: 11px; cursor: pointer;
  }
  #audioMenu button#muteBtn.active { color: var(--hot); border-color: var(--hot); }
</style>
</head>
<body>
<div class="atmosphere"></div>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="room">SALA <b id="roomCode">----</b></div>
  <div id="audioPanel">
    <button id="audioToggle" title="Audio">♪</button>
    <div id="audioMenu">
      <label>SFX
        <input type="range" id="sfxRange" min="0" max="1" step="0.01" />
      </label>
      <label>Música
        <input type="range" id="musicRange" min="0" max="1" step="0.01" />
      </label>
      <label>Master
        <input type="range" id="masterRange" min="0" max="1" step="0.01" />
      </label>
      <div class="muteRow">
        <span>Silenciar</span>
        <button id="muteBtn">OFF</button>
      </div>
    </div>
  </div>
  <div id="topbar"></div>
  <div id="roundBanner"></div>
  <div id="overlay"><div id="fightText">FIGHT!</div></div>
  <div id="lobbyPanel">
    <h2>Esperando jugadores…</h2>
    <p>Conéctense en el celular. El host puede moverse y elegir las rondas.</p>
  </div>
  <div id="finalScreen">
    <h1 id="winnerTitle">GANADOR</h1>
    <svg id="dancer" viewBox="0 0 100 120"></svg>
    <div id="ranking"></div>
  </div>
</div>

<script>
// Modo caracol: perf mode for low-end TV browsers. The host picks it from a switch in
// controller.html's lobby panel; the choice arrives on the "start" message (see the
// ac.onMessage handler below) and is applied before the match begins. Starts false here;
// stickman.js/fx.js/world.js all read window.SNAIL_MODE live, not a cached copy.
window.SNAIL_MODE = false;
</script>
<script src="https://freeconsole.vercel.app/sdk.js"></script>
<script src="stickman.js"></script>
<script src="fx.js"></script>
<script src="world.js"></script>
<script src="audio.js"></script>
<script>
(function () {
  "use strict";
  AudioManager.armUnlock();
  var ac = new FreeConsole();
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W = 960, H = 540;
  // Gravity scaled up ~2.2x from the original 0.46/0.34/-14.2 (JUMP_V by sqrt of that) so
  // jumps still reach roughly the same apex height but rise/fall much faster — apex is
  // reached in ~22 frames instead of ~31, well under a second, with a snappy landing instead
  // of a long hang at the top.
  var GRAVITY_UP = 0.95, GRAVITY_DOWN = 0.7, SPEED = 4.3, JUMP_V = -20.5;
  var PW = 13, PH = 52; // half-width, height
  var PUNCH_MS = 230, KICK_MS = 280, ATTACK_COOLDOWN = 380;

  /* ---------------------------------------------------------------- rng / maps */
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var MAP0 = {
    name: "Plataforma Inicial",
    bg: ["#0a0c18", "#141a30"],
    biome: "ruinas",
    seed: 1,
    hazards: [],
    platforms: [
      { x: 60, y: 460, w: 840, h: 26 },
      { x: 120, y: 340, w: 160, h: 18 },
      { x: 680, y: 340, w: 160, h: 18 },
      { x: 400, y: 250, w: 160, h: 18 },
    ],
  };

  function genMap(seed) {
    return World.generateMap(seed, { SPEED: SPEED, JUMP_V: JUMP_V, GRAVITY_UP: GRAVITY_UP, GRAVITY_DOWN: GRAVITY_DOWN, W: W, H: H });
  }

  /* ---------------------------------------------------------------- state */
  var phase = "lobby"; // lobby | fightIntro | fight | roundEnd | final
  var currentMap = MAP0;
  var currentRound = 0, totalRounds = 3;
  var roster = []; // device ids fixed for the whole match
  var scores = {}; // device_id -> total score
  var players = {}; // device_id -> player object
  var eliminationOrder = [];
  var phaseTimer = 0;
  var roundBannerText = "";

  function newPlayer(id) {
    return {
      id: id,
      x: 100 + Math.random() * (W - 200),
      y: -40,
      vx: 0, vy: 0,
      grounded: false,
      facing: 1,
      hp: 100,
      alive: true,
      attack: null, // {type, t, hitSet}
      attackCooldown: 0,
      input: { left: false, right: false },
      jumpEdge: false,
      punchEdge: false,
      walkCycle: 0,
      idleT: Math.random() * 10,
      squash: 0, // landing squash-and-stretch, 0..1 decaying
      hitStunT: 0, hitDir: 1, // knockback lean, decays after being hit
      jumpAnticT: 0, // brief crouch-anticipation before launch, decays
      deathFadeT: 0, // >0 while a recently-eliminated player fades out of the render
    };
  }

  function ensurePlayer(id) {
    if (!players[id]) players[id] = newPlayer(id);
    return players[id];
  }

  function phaseSnapshot() {
    return {
      t: "phase", phase: phase, rounds: totalRounds, round: currentRound,
      alive: Object.keys(players).filter(function (k) { return players[k].alive; }).map(Number),
      mapName: currentMap.name,
    };
  }

  function broadcastPhase() {
    ac.broadcast(phaseSnapshot());
  }

  /* ---------------------------------------------------------------- topbar UI */
  function renderTopbar() {
    var bar = document.getElementById("topbar");
    bar.innerHTML = "";
    roster.forEach(function (id) {
      var p = players[id];
      var div = document.createElement("div");
      div.className = "avatar" + (p && !p.alive && phase !== "lobby" ? " out" : "");
      var color = ac.getPlayerColor(id);
      div.style.color = color;
      div.style.background = color;
      div.innerHTML = '<div class="x">✕</div>';
      bar.appendChild(div);
    });
  }

  /* ---------------------------------------------------------------- lobby / round flow */
  function startMatch(rounds) {
    totalRounds = Math.max(1, Math.min(20, rounds || 3));
    // Union getControllerDeviceIds() with whoever's already tracked in players{}, rather than
    // trusting the SDK's device-table snapshot alone: that table is refreshed by a "devices"
    // broadcast from the shell, and on a real network a guest who joined and moved around in
    // the lobby a moment ago can still be missing from it if the host hits start before that
    // broadcast lands — dropping them from the roster right as the match begins, which reads
    // as "everyone but the host disappeared". Anyone already in players{} got there through
    // onConnect or an actual "in" input message, so they're real regardless of this snapshot.
    var rosterSet = {};
    ac.getControllerDeviceIds().forEach(function (id) { rosterSet[id] = true; });
    Object.keys(players).forEach(function (id) { rosterSet[id] = true; });
    roster = Object.keys(rosterSet).map(Number);
    scores = {};
    roster.forEach(function (id) { scores[id] = 0; });
    currentRound = 0;
    document.getElementById("lobbyPanel").classList.add("hide");
    nextRound();
  }

  // Every spawn x is chosen from inside an actual platform's span, so a straight vertical
  // fall always lands on solid ground — never into the void between platforms.
  function spawnRoundPlayers(map) {
    var plats = map.platforms;
    roster.forEach(function (id, i) {
      var p = ensurePlayer(id);
      var plat = plats[i % plats.length];
      var pad = Math.min(22, plat.w / 3);
      var lo = plat.x + pad, hi = plat.x + plat.w - pad;
      if (hi <= lo) { lo = plat.x + plat.w / 2; hi = lo; }
      p.x = lo + Math.random() * (hi - lo);
      p.y = -20 - i * 50;
      p.vx = 0; p.vy = 0;
      p.hp = 100;
      p.alive = true;
      p.attack = null;
      p.attackCooldown = 0;
    });
  }

  function nextRound() {
    currentRound++;
    if (currentRound > totalRounds) { endMatch(); return; }
    currentMap = currentRound === 1 ? MAP0 : genMap(1000 + currentRound * 37 + Math.floor(Math.random() * 900));
    eliminationOrder = [];
    spawnRoundPlayers(currentMap);
    roundBannerText = "RONDA " + currentRound + " / " + totalRounds + " — " + currentMap.name;
    var rb = document.getElementById("roundBanner");
    rb.textContent = roundBannerText;
    rb.classList.add("show");
    phase = "fightIntro";
    phaseTimer = 1100;
    var ft = document.getElementById("fightText");
    ft.classList.remove("show"); void ft.offsetWidth; ft.classList.add("show");
    renderTopbar();
    broadcastPhase();
    AudioManager.on.roundStart(currentMap.biome);
  }

  function eliminate(p) {
    if (!p.alive) return;
    p.alive = false;
    p.deathFadeT = 420;
    eliminationOrder.push(p.id);
    HitStop.trigger(55);
    Camera.addTrauma(0.85);
    Camera.zoomImpulse(0.05);
    ScreenFX.flash(0.5);
    Particles.eliminationBurst(p.x, p.y - 24, ac.getPlayerColor(p.id));
    renderTopbar();
    AudioManager.on.ko();
    var aliveN = roster.filter(function (id) { return players[id] && players[id].alive; }).length;
    if (aliveN === 2) AudioManager.on.clutch();
    checkRoundEnd();
  }

  function checkRoundEnd() {
    if (phase !== "fight") return;
    var alive = roster.filter(function (id) { return players[id] && players[id].alive; });
    if (alive.length <= 1) {
      if (alive.length === 1) eliminationOrder.push(alive[0]);
      var n = eliminationOrder.length;
      eliminationOrder.forEach(function (id, idx) {
        var placement = idx + 1; // first eliminated = 1 point, survivor = n points
        scores[id] = (scores[id] || 0) + placement;
      });
      phase = "roundEnd";
      phaseTimer = 2600;
      broadcastPhase();
    }
  }

  function endMatch() {
    phase = "final";
    document.getElementById("roundBanner").classList.remove("show");
    var ranked = roster.slice().sort(function (a, b) { return (scores[b] || 0) - (scores[a] || 0); });
    var winner = ranked[0];
    document.getElementById("winnerTitle").textContent = winner !== undefined ? ac.getNickname(winner).toUpperCase() + " GANA" : "SIN GANADOR";
    var rk = document.getElementById("ranking");
    rk.innerHTML = "";
    ranked.forEach(function (id, i) {
      var row = document.createElement("div");
      row.className = "rankRow" + (i === 0 ? " win" : "");
      row.innerHTML = '<div class="pos">#' + (i + 1) + '</div>' +
        '<div class="dot" style="color:' + ac.getPlayerColor(id) + ';background:' + ac.getPlayerColor(id) + '"></div>' +
        '<div class="nm">' + ac.getNickname(id) + '</div>' +
        '<div class="sc">' + (scores[id] || 0) + ' pts</div>';
      rk.appendChild(row);
    });
    if (winner !== undefined) drawDancer(ac.getPlayerColor(winner));
    document.getElementById("finalScreen").classList.add("show");
    broadcastPhase();
    if (winner !== undefined) AudioManager.on.victory(); else AudioManager.on.gameOver();
  }

  function resetToLobby() {
    document.getElementById("finalScreen").classList.remove("show");
    document.getElementById("lobbyPanel").classList.remove("hide");
    document.getElementById("roundBanner").classList.remove("show");
    phase = "lobby";
    players = {};
    roster = [];
    scores = {};
    currentRound = 0;
    currentMap = MAP0;
    broadcastPhase();
    AudioManager.on.toLobby();
  }

  var dancerT = 0, dancerRaf = null;
  function drawDancer(color) {
    var svg = document.getElementById("dancer");
    if (dancerRaf) cancelAnimationFrame(dancerRaf);
    function frame() {
      dancerT += 0.12;
      var armSwing = Math.sin(dancerT) * 30;
      var legSwing = Math.sin(dancerT + Math.PI) * 22;
      var bob = Math.abs(Math.sin(dancerT * 2)) * 8;
      var hy = 24 - bob;
      svg.innerHTML =
        '<circle cx="50" cy="' + hy + '" r="12" fill="none" stroke="' + color + '" stroke-width="4"/>' +
        '<line x1="50" y1="' + (hy + 12) + '" x2="50" y2="' + (hy + 55) + '" stroke="' + color + '" stroke-width="4"/>' +
        '<line x1="50" y1="' + (hy + 22) + '" x2="' + (50 + armSwing) + '" y2="' + (hy + 5) + '" stroke="' + color + '" stroke-width="4" stroke-linecap="round"/>' +
        '<line x1="50" y1="' + (hy + 22) + '" x2="' + (50 - armSwing) + '" y2="' + (hy + 40) + '" stroke="' + color + '" stroke-width="4" stroke-linecap="round"/>' +
        '<line x1="50" y1="' + (hy + 55) + '" x2="' + (50 + legSwing) + '" y2="' + (hy + 95) + '" stroke="' + color + '" stroke-width="4" stroke-linecap="round"/>' +
        '<line x1="50" y1="' + (hy + 55) + '" x2="' + (50 - legSwing) + '" y2="' + (hy + 95) + '" stroke="' + color + '" stroke-width="4" stroke-linecap="round"/>';
      if (document.getElementById("finalScreen").classList.contains("show")) dancerRaf = requestAnimationFrame(frame);
    }
    frame();
  }

  /* ---------------------------------------------------------------- physics */
  function stepPlayer(p, dt, damageEnabled) {
    if (!p.alive) {
      if (p.deathFadeT > 0) p.deathFadeT = Math.max(0, p.deathFadeT - dt);
      return;
    }
    var inLobby = phase === "lobby";
    if (p.input.left && !p.input.right) { p.vx = -SPEED; p.facing = -1; }
    else if (p.input.right && !p.input.left) { p.vx = SPEED; p.facing = 1; }
    else p.vx = 0;

    if (p.jumpEdge && p.grounded) { p.vy = JUMP_V; p.grounded = false; p.jumpAnticT = 90; AudioManager.on.jump(); }
    p.jumpEdge = false;

    if (p.punchEdge && p.attackCooldown <= 0) {
      var airborne = !p.grounded;
      var dur = airborne ? KICK_MS : PUNCH_MS;
      p.attack = { type: airborne ? "kick" : "punch", t: dur, dur: dur, hitSet: {} };
      p.attackCooldown = ATTACK_COOLDOWN;
      AudioManager.on.swing(p.attack.type);
    }
    p.punchEdge = false;

    p.vy += p.vy < 0 ? GRAVITY_UP : GRAVITY_DOWN;
    var prevFeet = p.y;
    var wasGrounded = p.grounded;
    p.y += p.vy;
    p.kbx = (p.kbx || 0) * 0.88;
    if (Math.abs(p.kbx) < 0.05) p.kbx = 0;
    p.x += p.vx + p.kbx;
    p.x = Math.max(14, Math.min(W - 14, p.x));

    if (p.vx !== 0 && wasGrounded) p.walkCycle = ((p.walkCycle || 0) + dt * 0.0034) % 1;
    p.idleT += dt * 0.001;
    if (p.squash > 0) p.squash = Math.max(0, p.squash - dt * 0.006);
    if (p.jumpAnticT > 0) p.jumpAnticT = Math.max(0, p.jumpAnticT - dt);
    if (p.hitStunT > 0) p.hitStunT = Math.max(0, p.hitStunT - dt);
    if (p.deathFadeT > 0) p.deathFadeT = Math.max(0, p.deathFadeT - dt);

    p.grounded = false;
    var plats = currentMap.platforms;
    for (var pi = 0; pi < plats.length; pi++) {
      var pl = plats[pi];
      if (p.vy >= 0 && prevFeet <= pl.y + 1 && p.y >= pl.y && p.x + PW > pl.x && p.x - PW < pl.x + pl.w) {
        p.y = pl.y;
        if (!wasGrounded && p.vy > 5) {
          p.squash = Math.min(1, p.vy / 14);
          var landStrength = clamp(p.vy / 14, 0, 1);
          Camera.addTrauma(landStrength * 0.22);
          if (!window.SNAIL_MODE) Particles.landingDust(p.x, p.y, p.facing, landStrength, "rgba(255,255,255,.55)");
          AudioManager.on.land(landStrength);
        }
        p.vy = 0; p.grounded = true;
      }
    }

    if (p.y > H + 60) {
      if (inLobby) { p.x = 100 + Math.random() * (W - 200); p.y = -40; p.vy = 0; p.vx = 0; }
      else if (damageEnabled) { eliminate(p); }
    }

    if (damageEnabled && p.alive && World.checkHazards(p, currentMap, PW)) { eliminate(p); }

    if (p.attack) {
      p.attack.t -= dt;
      if (damageEnabled) {
        for (var oi = 0; oi < roster.length; oi++) {
          var oid = roster[oi];
          if (oid === p.id) continue;
          var o = players[oid];
          if (!o || !o.alive || p.attack.hitSet[oid]) continue;
          var reach = p.attack.type === "kick" ? 44 : 34;
          var dx = o.x - p.x;
          var facingOk = p.facing > 0 ? (dx > -6 && dx < reach) : (dx < 6 && dx > -reach);
          var dy = Math.abs(o.y - p.y - 10);
          if (facingOk && dy < 60) {
            p.attack.hitSet[oid] = true;
            var dmg = p.attack.type === "kick" ? 16 : 10;
            var kbX = p.attack.type === "kick" ? 3.2 : 2.1;
            var kbY = p.attack.type === "kick" ? -2 : 0;
            o.hp -= dmg;
            o.kbx = (o.kbx || 0) + p.facing * kbX;
            o.vy += kbY;
            if (kbY < 0) o.grounded = false;

            var hitX = o.x, hitY = o.y - 14;
            var isKick = p.attack.type === "kick";
            HitStop.trigger(isKick ? 55 : 35);
            Camera.addTrauma(isKick ? 0.5 : 0.32);
            Camera.zoomImpulse(0.03);
            if (!window.SNAIL_MODE) Particles.punchSparks(hitX, hitY, p.facing, ac.getPlayerColor(p.id));
            ScreenFX.impactStreak(hitX, hitY, p.facing);
            AudioManager.on.hit(p.attack.type);
            o.hitStunT = 180;
            o.hitDir = p.facing;

            if (o.hp <= 0) eliminate(o);
          }
        }
      }
      if (p.attack.t <= 0) p.attack = null;
    }
    if (p.attackCooldown > 0) p.attackCooldown -= dt;
  }

  /* ---------------------------------------------------------------- rendering */
  function drawMap(map, tMs, dt) {
    World.draw(ctx, W, H, map, Camera, tMs, dt);
  }

  function drawPlayer(p) {
    if (!p.alive && phase !== "lobby" && p.deathFadeT <= 0) return;
    var color = ac.getPlayerColor(p.id);

    // motion trail ghosts while an attack is in flight (Trails.draw is a no-op in snail mode,
    // so skip feeding it too — no point pushing snapshots nobody will render)
    if (p.attack && !window.SNAIL_MODE) {
      Trails.push(p, performance.now());
      Trails.draw(ctx, p, function (gctx, ghost) { drawStickman(gctx, ghost, color); });
    } else if (p._trail) {
      Trails.clear(p);
    }

    var fading = !p.alive && p.deathFadeT > 0;
    if (fading) ctx.globalAlpha = clamp(p.deathFadeT / 420, 0, 1);
    var rig = drawStickman(ctx, p, color);
    var headY = rig.headY;
    if (fading) { ctx.globalAlpha = 1; return; }

    // hp bar (only during fight/roundend)
    if (phase === "fight" || phase === "fightIntro" || phase === "roundEnd") {
      var bw = 40;
      ctx.fillStyle = "rgba(0,0,0,.5)";
      ctx.fillRect(p.x - bw / 2, headY - 24, bw, 5);
      ctx.fillStyle = color;
      ctx.fillRect(p.x - bw / 2, headY - 24, bw * Math.max(0, p.hp) / 100, 5);
    }

    // nickname — text rasterization (font metrics + glyph fill) is surprisingly costly per
    // player per frame on weak TV engines; skip it in snail mode, the colored topbar avatars
    // already identify who's who.
    if (!window.SNAIL_MODE) {
      ctx.fillStyle = "rgba(255,255,255,.7)";
      ctx.font = "10px Chakra Petch, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(ac.getNickname(p.id), p.x, headY - 30);
    }
  }

  /* ---------------------------------------------------------------- main loop */
  var last = performance.now();
  var SNAIL_FRAME_MS = 1000 / 24; // caps render+step rate once engaged; rAF still fires at panel rate
  function loop(now) {
    if (window.SNAIL_MODE && now - last < SNAIL_FRAME_MS) {
      requestAnimationFrame(loop);
      return;
    }
    var realDt = Math.min(40, now - last);
    last = now;

    HitStop.update(realDt);
    var frozen = HitStop.active();
    var dt = frozen ? 0 : realDt;

    if (!frozen) {
      var damageEnabled = phase === "fight";
      var idsToStep = phase === "lobby" ? Object.keys(players) : roster;
      for (var si = 0; si < idsToStep.length; si++) stepPlayer(players[idsToStep[si]], dt, damageEnabled);

      if (phase === "fightIntro") {
        phaseTimer -= dt;
        if (phaseTimer <= 0) { phase = "fight"; Camera.zoomImpulse(0.04); broadcastPhase(); AudioManager.on.fightBegin(); }
      } else if (phase === "roundEnd") {
        phaseTimer -= dt;
        if (phaseTimer <= 0) nextRound();
      }

      Camera.update(dt);
      Particles.update(dt);
      ScreenFX.update(dt);
    }

    Camera.begin(ctx, W, H);
    drawMap(currentMap, now, dt);
    // plain for-loops here, not .forEach — a fresh closure allocated every single frame is
    // pure GC pressure with zero benefit, and this runs for every player every frame.
    if (phase === "lobby") {
      var lobbyIds = Object.keys(players);
      for (var li = 0; li < lobbyIds.length; li++) drawPlayer(players[lobbyIds[li]]);
    } else {
      for (var ri = 0; ri < roster.length; ri++) drawPlayer(players[roster[ri]]);
    }
    Particles.draw(ctx);
    Camera.end(ctx);

    ScreenFX.drawVignette(ctx, W, H);
    ScreenFX.draw(ctx, W, H);

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---------------------------------------------------------------- SDK wiring */
  ac.onReady = function (code) {
    document.getElementById("roomCode").textContent = code || "----";
  };

  ac.onConnect = function (device_id) {
    if (phase === "lobby") { ensurePlayer(device_id); renderTopbar(); }
  };

  ac.onDisconnect = function (device_id) {
    if (players[device_id] && phase !== "lobby") {
      eliminate(players[device_id]);
    }
    if (phase === "lobby") { delete players[device_id]; renderTopbar(); }
  };

  ac.onMessage = function (device_id, data) {
    if (!data) return;
    if (data.t === "in") {
      var p = ensurePlayer(device_id);
      if (data.k === "left") p.input.left = data.d;
      if (data.k === "right") p.input.right = data.d;
      if (data.k === "jump" && data.d) p.jumpEdge = true;
      if (data.k === "punch" && data.d) p.punchEdge = true;
      if (phase === "lobby") renderTopbar();
      return;
    }
    if (data.t === "snail" && device_id === ac.getMasterControllerDeviceId()) {
      window.SNAIL_MODE = !!data.on;
      return;
    }
    if (data.t === "start" && device_id === ac.getMasterControllerDeviceId() && phase === "lobby") {
      window.SNAIL_MODE = !!data.snail;
      startMatch(data.rounds);
      return;
    }
    if (data.t === "restart" && device_id === ac.getMasterControllerDeviceId() && phase === "final") {
      resetToLobby();
      return;
    }
    if (data.t === "roundsPreview" && device_id === ac.getMasterControllerDeviceId() && phase === "lobby") {
      ac.broadcast({ t: "roundsPreview", n: data.n });
    }
    if (data.t === "syncRequest") {
      // A phone that was locked/backgrounded missed whatever "phase" broadcast fired while it
      // was asleep (e.g. the host started the match) — it reconnects to the same room but
      // never gets that push replayed, so it's stuck showing "esperando...". The controller
      // asks for a resync the moment its screen wakes up; answer with the current snapshot
      // targeted at just that device instead of waiting for the next natural broadcast.
      ac.message(device_id, phaseSnapshot());
      return;
    }
  };

  ac.onActivePlayersChange = function () {};
  renderTopbar();

  /* ---------------------------------------------------------------- audio panel */
  (function () {
    var s = AudioManager.getSettings();
    var sfxRange = document.getElementById("sfxRange");
    var musicRange = document.getElementById("musicRange");
    var masterRange = document.getElementById("masterRange");
    var muteBtn = document.getElementById("muteBtn");
    sfxRange.value = s.sfx;
    musicRange.value = s.music;
    masterRange.value = s.master;
    muteBtn.textContent = s.muted ? "ON" : "OFF";
    muteBtn.classList.toggle("active", s.muted);

    document.getElementById("audioToggle").addEventListener("click", function () {
      document.getElementById("audioMenu").classList.toggle("show");
    });
    sfxRange.addEventListener("input", function () { AudioManager.setSfxVolume(parseFloat(sfxRange.value)); });
    musicRange.addEventListener("input", function () { AudioManager.setMusicVolume(parseFloat(musicRange.value)); });
    masterRange.addEventListener("input", function () { AudioManager.setMasterVolume(parseFloat(masterRange.value)); });
    muteBtn.addEventListener("click", function () {
      var muted = !AudioManager.getSettings().muted;
      AudioManager.setMuted(muted);
      muteBtn.textContent = muted ? "ON" : "OFF";
      muteBtn.classList.toggle("active", muted);
    });
  })();
})();
</script>
</body>
</html>
