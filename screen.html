<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Last One Standing — Screen</title>
<link rel="stylesheet" href="https://freeconsole.vercel.app/console.css" />
<style>
  html, body { height: 100%; overflow: hidden; background: #05060d; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #05060d; box-shadow: 0 0 80px rgba(53,240,224,.08); }

  #topbar {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 5; pointer-events: none;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; position: relative;
    border: 2px solid rgba(255,255,255,.25); box-shadow: 0 0 12px currentColor;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 11px; color: #05060d; font-weight: 700;
    transition: opacity .3s;
  }
  .avatar.out { opacity: .35; }
  .avatar .x {
    position: absolute; inset: -4px; display: none; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 900; font-size: 30px; color: #ff2e88;
    text-shadow: 0 0 10px #ff2e88, 0 0 2px #000;
  }
  .avatar.out .x { display: flex; }

  #room {
    position: absolute; top: 14px; left: 18px; z-index: 5;
    font-family: var(--font-mono); color: var(--text-dim); font-size: 13px;
    letter-spacing: .08em;
  }
  #room b { color: var(--glow); }

  #overlay {
    position: absolute; inset: 0; z-index: 10; pointer-events: none;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
  }
  #fightText {
    font-family: var(--font-display); font-weight: 900; font-size: 96px;
    color: var(--hot); text-shadow: var(--bloom-hot); opacity: 0; letter-spacing: .05em;
    transform: scale(.6);
  }
  #fightText.show { animation: fightPop .9s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes fightPop {
    0% { opacity: 0; transform: scale(.4) rotate(-4deg); }
    35% { opacity: 1; transform: scale(1.15) rotate(2deg); }
    60% { transform: scale(1) rotate(0); }
    85% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.3); }
  }

  #roundBanner {
    position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-mono); color: var(--text); font-size: 15px;
    background: rgba(10,12,24,.6); padding: 4px 14px; border-radius: 999px;
    border: 1px solid var(--line); letter-spacing: .1em; z-index: 5;
    display: none;
  }
  #roundBanner.show { display: block; }

  #lobbyPanel {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    text-align: center; z-index: 6; font-family: var(--font-display);
  }
  #lobbyPanel h2 { margin: 0 0 4px; color: var(--glow); text-shadow: var(--bloom-glow); font-size: 26px; }
  #lobbyPanel p { margin: 0; color: var(--text-dim); font-size: 14px; }
  #lobbyPanel.hide { display: none; }

  #finalScreen {
    position: absolute; inset: 0; z-index: 20; display: none;
    background: radial-gradient(circle at 50% 30%, rgba(53,240,224,.08), transparent 60%), var(--ink-900);
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  }
  #finalScreen.show { display: flex; }
  #finalScreen h1 {
    font-family: var(--font-marquee); font-size: 42px; color: var(--amber);
    text-shadow: 0 0 20px rgba(255,194,71,.6); margin: 0;
  }
  #ranking { display: flex; flex-direction: column; gap: 8px; width: 420px; }
  .rankRow {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: var(--radius-sm);
    font-family: var(--font-display); color: var(--text);
  }
  .rankRow .pos { font-family: var(--font-mono); color: var(--text-faint); width: 24px; }
  .rankRow .dot { width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
  .rankRow .nm { flex: 1; }
  .rankRow .sc { font-family: var(--font-mono); color: var(--glow); }
  .rankRow.win { border-color: var(--amber); box-shadow: 0 0 18px rgba(255,194,71,.25); }
  #dancer { width: 140px; height: 160px; }

  #audioPanel {
    position: absolute; top: 14px; right: 18px; z-index: 6;
    font-family: var(--font-mono); color: var(--text-dim); font-size: 11px;
  }
  #audioToggle {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
    background: rgba(10,12,24,.6); color: var(--text-dim); cursor: pointer; font-size: 15px;
  }
  #audioMenu {
    display: none; position: absolute; top: 42px; right: 0; width: 190px;
    background: rgba(10,12,24,.92); border: 1px solid var(--line); border-radius: var(--radius-sm, 10px);
    padding: 12px 14px; backdrop-filter: blur(8px);
  }
  #audioMenu.show { display: block; }
  #audioMenu label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; letter-spacing: .04em; }
  #audioMenu label span { width: 46px; flex-shrink: 0; }
  #audioMenu input[type="range"] { flex: 1; accent-color: var(--glow); }
  #audioMenu .muteRow { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
  #audioMenu button#muteBtn {
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
    border-radius: 999px; padding: 4px 10px; font-family: var(--font-mono); font-size: 11px; cursor: pointer;
  }
  #audioMenu button#muteBtn.active { color: var(--hot); border-color: var(--hot); }
</style>
</head>
<body>
<div class="atmosphere"></div>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="room">SALA <b id="roomCode">----</b></div>
  <div id="audioPanel">
    <button id="audioToggle" title="Audio">♪</button>
    <div id="audioMenu">
      <label>SFX
        <input type="range" id="sfxRange" min="0" max="1" step="0.01" />
      </label>
      <label>Música
        <input type="range" id="musicRange" min="0" max="1" step="0.01" />
      </label>
      <label>Master
        <input type="range" id="masterRange" min="0" max="1" step="0.01" />
      </label>
      <div class="muteRow">
        <span>Silenciar</span>
        <button id="muteBtn">OFF</button>
      </div>
    </div>
  </div>
  <div id="topbar"></div>
  <div id="roundBanner"></div>
  <div id="overlay"><div id="fightText">FIGHT!</div></div>
  <div id="lobbyPanel">
    <h2>Esperando jugadores…</h2>
    <p>Conéctense en el celular. El host puede moverse y elegir las rondas.</p>
  </div>
  <div id="finalScreen">
    <h1 id="winnerTitle">GANADOR</h1>
    <svg id="dancer" viewBox="0 0 100 120"></svg>
    <div id="ranking"></div>
  </div>
</div>

<script>
// Modo caracol: perf mode for low-end TV browsers. The host picks it from a switch in
// controller.html's lobby panel; the choice arrives on the "start" message (see the
// ac.onMessage handler below) and is applied before the match begins. Starts false here;
// stickman.js/fx.js/world.js all read window.SNAIL_MODE live, not a cached copy.
window.SNAIL_MODE = false;
</script>
<script src="https://freeconsole.vercel.app/sdk.js"></script>
<script src="stickman.js"></script>
<script src="fx.js"></script>
<script src="world.js"></script>
<script src="audio.js"></script>
<script>
(function () {
  "use strict";
  AudioManager.armUnlock();
  var ac = new FreeConsole();
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W = 960, H = 540;
  // Gravity scaled up ~2.2x from the original 0.46/0.34/-14.2 (JUMP_V by sqrt of that) so
  // jumps still reach roughly the same apex height but rise/fall much faster — apex is
  // reached in ~22 frames instead of ~31, well under a second, with a snappy landing instead
  // of a long hang at the top.
  var GRAVITY_UP = 0.95, GRAVITY_DOWN = 0.7, SPEED = 4.3, JUMP_V = -20.5;
  var PW = 13, PH = 52; // half-width, height
  var PUNCH_MS = 230, KICK_MS = 280, ATTACK_COOLDOWN = 380;

  /* Rey de la Colina / Rey del Orbe: mismos números y misma lógica que el build online (ver
     online/sim.js), portados a mano acá porque esta pantalla no comparte módulo de simulación
     con el resto de los builds — es su propio loop desde siempre. */
  var HILL_APPEAR_DELAY_MS = 5000, HILL_ACTIVE_MS = 15000, HILL_RADIUS = 95;
  var HILL_TARGET_MS = 30000, HILL_TARGET_SCORE = 100;
  var ORBKING_MATCH_MS = 120000;

  /* ---------------------------------------------------------------- rng / maps */
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var MAP0 = {
    name: "Plataforma Inicial",
    bg: ["#0a0c18", "#141a30"],
    biome: "ruinas",
    seed: 1,
    hazards: [],
    platforms: [
      { x: 60, y: 460, w: 840, h: 26 },
      { x: 120, y: 340, w: 160, h: 18 },
      { x: 680, y: 340, w: 160, h: 18 },
      { x: 400, y: 250, w: 160, h: 18 },
    ],
  };

  function genMap(seed, forcedArchId) {
    return World.generateMap(seed, { SPEED: SPEED, JUMP_V: JUMP_V, GRAVITY_UP: GRAVITY_UP, GRAVITY_DOWN: GRAVITY_DOWN, W: W, H: H }, forcedArchId);
  }

  /* ---------------------------------------------------------------- state */
  var phase = "lobby"; // lobby | fightIntro | fight | roundEnd | final
  var currentMap = MAP0;
  var currentRound = 0, totalRounds = 3;
  var roster = []; // device ids fixed for the whole match
  var scores = {}; // device_id -> total score
  var players = {}; // device_id -> player object
  var eliminationOrder = [];
  var phaseTimer = 0;
  var roundBannerText = "";
  /* "rounds" es el único modo que existía. "koth"/"orbking" no eliminan a nadie — ver
     noElimination() y su uso en eliminate() — y deciden la partida por puntaje en vez de por
     supervivencia (updateHill()/updateOrbHold()). */
  var gameMode = "rounds"; // "rounds" | "koth" | "orbking"
  function noElimination() { return gameMode === "koth" || gameMode === "orbking"; }
  var hill = null, hillTimer = 0, hillLastPlatformIdx = -1;
  var orbkingTimer = 0;

  function newPlayer(id) {
    return {
      id: id,
      x: 100 + Math.random() * (W - 200),
      y: -40,
      vx: 0, vy: 0,
      grounded: false,
      facing: 1,
      hp: 100,
      alive: true,
      attack: null, // {type, t, hitSet}
      attackCooldown: 0,
      input: { left: false, right: false },
      jumpEdge: false,
      punchEdge: false,
      kickEdge: false,
      walkCycle: 0,
      idleT: Math.random() * 10,
      squash: 0, // landing squash-and-stretch, 0..1 decaying
      hitStunT: 0, hitDir: 1, // knockback lean, decays after being hit
      jumpAnticT: 0, // brief crouch-anticipation before launch, decays
      deathFadeT: 0, // >0 while a recently-eliminated player fades out of the render
      power: null, // { type: "fuego"|"hielo"|"tierra"|"aire", t: ms remaining } from an orb pickup
      burnT: 0, burnTickT: 0, // fuego DoT stamped on a hit target, independent of the attacker's power window
      burnFlashT: 0, // decaying — refreshed on the fire hit itself and on every DoT tick, purely visual
      slowT: 0, // hielo slow stamped on a hit target
      hillMs: 0, orbMs: 0, // acumulado de Rey de la Colina / Rey del Orbe — sobrevive al respawn
    };
  }

  function ensurePlayer(id) {
    if (!players[id]) players[id] = newPlayer(id);
    return players[id];
  }

  function phaseSnapshot() {
    return {
      t: "phase", phase: phase, rounds: totalRounds, round: currentRound,
      alive: Object.keys(players).filter(function (k) { return players[k].alive; }).map(Number),
      mapName: currentMap.name, mode: gameMode,
    };
  }

  function broadcastPhase() {
    ac.broadcast(phaseSnapshot());
  }

  /* ---------------------------------------------------------------- topbar UI */
  function renderTopbar() {
    var bar = document.getElementById("topbar");
    bar.innerHTML = "";
    roster.forEach(function (id) {
      var p = players[id];
      var div = document.createElement("div");
      div.className = "avatar" + (p && !p.alive && phase !== "lobby" ? " out" : "");
      var color = ac.getPlayerColor(id);
      div.style.color = color;
      div.style.background = color;
      div.innerHTML = '<div class="x">✕</div>';
      bar.appendChild(div);
    });
  }

  /* ---------------------------------------------------------------- lobby / round flow */
  // Rey de la Colina / Rey del Orbe son una sola ronda que nunca termina por eliminación (ver
  // noElimination()); Colina usa el archetype "colina" de world.js (más terreno que el resto,
  // más rutas hacia el círculo), Orbe juega mapas normales — el reloj de 2 min ya la limita.
  function startMatch(rounds, mode) {
    gameMode = mode === "koth" || mode === "orbking" ? mode : "rounds";
    totalRounds = noElimination() ? 1 : Math.max(1, Math.min(20, rounds || 3));
    // Union getControllerDeviceIds() with whoever's already tracked in players{}, rather than
    // trusting the SDK's device-table snapshot alone: that table is refreshed by a "devices"
    // broadcast from the shell, and on a real network a guest who joined and moved around in
    // the lobby a moment ago can still be missing from it if the host hits start before that
    // broadcast lands — dropping them from the roster right as the match begins, which reads
    // as "everyone but the host disappeared". Anyone already in players{} got there through
    // onConnect or an actual "in" input message, so they're real regardless of this snapshot.
    var rosterSet = {};
    ac.getControllerDeviceIds().forEach(function (id) { rosterSet[id] = true; });
    Object.keys(players).forEach(function (id) { rosterSet[id] = true; });
    roster = Object.keys(rosterSet).map(Number);
    scores = {};
    roster.forEach(function (id) {
      scores[id] = 0;
      var p = players[id];
      if (p) { p.hillMs = 0; p.orbMs = 0; }
    });
    hill = null; hillTimer = 0; hillLastPlatformIdx = -1; orbkingTimer = 0;
    currentRound = 0;
    document.getElementById("lobbyPanel").classList.add("hide");
    nextRound();
  }

  // Every spawn x is chosen from inside an actual platform's span, so a straight vertical
  // fall always lands on solid ground — never into the void between platforms.
  function spawnX(plat) {
    var pad = Math.min(22, plat.w / 3);
    var lo = plat.x + pad, hi = plat.x + plat.w - pad;
    if (hi <= lo) { lo = plat.x + plat.w / 2; hi = lo; }
    return lo + Math.random() * (hi - lo);
  }

  function spawnRoundPlayers(map) {
    var plats = map.platforms;
    roster.forEach(function (id, i) {
      var p = ensurePlayer(id);
      p.x = spawnX(plats[i % plats.length]);
      p.y = -20 - i * 50;
      p.vx = 0; p.vy = 0;
      p.hp = 100;
      p.alive = true;
      p.attack = null;
      p.attackCooldown = 0;
      p.power = null;
      p.burnT = 0; p.burnTickT = 0; p.burnFlashT = 0;
      p.slowT = 0;
    });
    orb = null;
    orbTimer = ORB_SPAWN_MS;
  }

  // Reaparece a un jugador de Colina/Orbe en vez de eliminarlo: mismo tratamiento que el spawn
  // de inicio de ronda, pero sin tocar hillMs/orbMs/scores — esos son el marcador de la
  // partida y tienen que sobrevivir al respawn.
  function respawnPlayer(p) {
    var plats = currentMap.platforms;
    p.x = spawnX(plats[Math.floor(Math.random() * plats.length)]);
    p.y = -20 - Math.random() * 60;
    p.vx = 0; p.vy = 0; p.kbx = 0; p.hp = 100;
    p.attack = null; p.attackCooldown = 0;
    p.power = null; p.burnT = 0; p.burnTickT = 0; p.burnFlashT = 0; p.slowT = 0;
    p.hitStunT = 0; p.deathFadeT = 0;
  }

  function nextRound() {
    currentRound++;
    if (currentRound > totalRounds) { endMatch(); return; }
    // Colina/Orbe no arrancan en el mapa inicial genérico de "ronda 1": son una partida entera,
    // no la primera de una serie, así que les toca un mapa procedural como a cualquier otra
    // ronda posterior.
    if (noElimination()) {
      currentMap = genMap(1000 + currentRound * 37 + Math.floor(Math.random() * 900), gameMode === "koth" ? "colina" : null);
    } else {
      currentMap = currentRound === 1 ? MAP0 : genMap(1000 + currentRound * 37 + Math.floor(Math.random() * 900));
    }
    eliminationOrder = [];
    spawnRoundPlayers(currentMap);
    roundBannerText = gameMode === "koth" ? "REY DE LA COLINA — " + currentMap.name
      : gameMode === "orbking" ? "REY DEL ORBE — " + currentMap.name
      : "RONDA " + currentRound + " / " + totalRounds + " — " + currentMap.name;
    var rb = document.getElementById("roundBanner");
    rb.textContent = roundBannerText;
    rb.classList.add("show");
    phase = "fightIntro";
    phaseTimer = 1100;
    var ft = document.getElementById("fightText");
    ft.classList.remove("show"); void ft.offsetWidth; ft.classList.add("show");
    renderTopbar();
    broadcastPhase();
    AudioManager.on.roundStart(currentMap.biome);
  }

  function eliminate(p) {
    if (!p.alive) return;
    HitStop.trigger(55);
    Camera.addTrauma(0.85);
    Camera.zoomImpulse(0.05);
    ScreenFX.flash(0.5);
    Particles.eliminationBurst(p.x, p.y - 24, ac.getPlayerColor(p.id));
    AudioManager.on.ko();

    // Colina/Orbe no eliminan a nadie: caerse o llegar a 0 hp solo hace que reaparezcas. La
    // partida la gana el puntaje (círculo o tiempo con power), no la supervivencia — así que
    // acá se corta antes de tocar alive/eliminationOrder/checkRoundEnd/el topbar de "afuera".
    if (noElimination()) {
      respawnPlayer(p);
      return;
    }

    p.alive = false;
    p.deathFadeT = 420;
    eliminationOrder.push(p.id);
    renderTopbar();
    var aliveN = roster.filter(function (id) { return players[id] && players[id].alive; }).length;
    if (aliveN === 2) AudioManager.on.clutch();
    checkRoundEnd();
  }

  function checkRoundEnd() {
    if (phase !== "fight") return;
    var alive = roster.filter(function (id) { return players[id] && players[id].alive; });
    if (alive.length <= 1) {
      if (alive.length === 1) eliminationOrder.push(alive[0]);
      var n = eliminationOrder.length;
      eliminationOrder.forEach(function (id, idx) {
        var placement = idx + 1; // first eliminated = 1 point, survivor = n points
        scores[id] = (scores[id] || 0) + placement;
      });
      phase = "roundEnd";
      phaseTimer = 2600;
      orb = null;
      broadcastPhase();
    }
  }

  function endMatch() {
    phase = "final";
    document.getElementById("roundBanner").classList.remove("show");
    var ranked = roster.slice().sort(function (a, b) { return (scores[b] || 0) - (scores[a] || 0); });
    var winner = ranked[0];
    document.getElementById("winnerTitle").textContent = winner !== undefined ? ac.getNickname(winner).toUpperCase() + " GANA" : "SIN GANADOR";
    var rk = document.getElementById("ranking");
    rk.innerHTML = "";
    ranked.forEach(function (id, i) {
      var row = document.createElement("div");
      row.className = "rankRow" + (i === 0 ? " win" : "");
      row.innerHTML = '<div class="pos">#' + (i + 1) + '</div>' +
        '<div class="dot" style="color:' + ac.getPlayerColor(id) + ';background:' + ac.getPlayerColor(id) + '"></div>' +
        '<div class="nm">' + ac.getNickname(id) + '</div>' +
        '<div class="sc">' + (scores[id] || 0) + ' pts</div>';
      rk.appendChild(row);
    });
    if (winner !== undefined) drawDancer(ac.getPlayerColor(winner));
    document.getElementById("finalScreen").classList.add("show");
    broadcastPhase();
    if (winner !== undefined) AudioManager.on.victory(); else AudioManager.on.gameOver();
  }

  function resetToLobby() {
    document.getElementById("finalScreen").classList.remove("show");
    document.getElementById("lobbyPanel").classList.remove("hide");
    document.getElementById("roundBanner").classList.remove("show");
    phase = "lobby";
    gameMode = "rounds";
    players = {};
    roster = [];
    scores = {};
    currentRound = 0;
    currentMap = MAP0;
    orb = null;
    orbTimer = ORB_SPAWN_MS;
    hill = null; hillTimer = 0; hillLastPlatformIdx = -1; orbkingTimer = 0;
    broadcastPhase();
    AudioManager.on.toLobby();
  }

  var dancerT = 0, dancerRaf = null;
  function drawDancer(color) {
    var svg = document.getElementById("dancer");
    if (dancerRaf) cancelAnimationFrame(dancerRaf);
    function frame() {
      dancerT += 0.12;
      var armSwing = Math.sin(dancerT) * 30;
      var legSwing = Math.sin(dancerT + Math.PI) * 22;
      var bob = Math.abs(Math.sin(dancerT * 2)) * 8;
      var hy = 24 - bob;
      svg.innerHTML =
        '<circle cx="50" cy="' + hy + '" r="12" fill="none" stroke="' + color + '" stroke-width="4"/>' +
        '<line x1="50" y1="' + (hy + 12) + '" x2="50" y2="' + (hy + 55) + '" stroke="' + color + '" stroke-width="4"/>' +
        '<line x1="50" y1="' + (hy + 22) + '" x2="' + (50 + armSwing) + '" y2="' + (hy + 5) + '" stroke="' + color + '" stroke-width="4" stroke-linecap="round"/>' +
        '<line x1="50" y1="' + (hy + 22) + '" x2="' + (50 - armSwing) + '" y2="' + (hy + 40) + '" stroke="' + color + '" stroke-width="4" stroke-linecap="round"/>' +
        '<line x1="50" y1="' + (hy + 55) + '" x2="' + (50 + legSwing) + '" y2="' + (hy + 95) + '" stroke="' + color + '" stroke-width="4" stroke-linecap="round"/>' +
        '<line x1="50" y1="' + (hy + 55) + '" x2="' + (50 - legSwing) + '" y2="' + (hy + 95) + '" stroke="' + color + '" stroke-width="4" stroke-linecap="round"/>';
      if (document.getElementById("finalScreen").classList.contains("show")) dancerRaf = requestAnimationFrame(frame);
    }
    frame();
  }

  /* ---------------------------------------------------------------- player-vs-player collision */
  // Simple pairwise AABB push-apart, run once per frame after every player has moved. O(n^2)
  // over the live roster (never more than a handful of players), so it's negligible next to
  // the rest of the frame. Purely positional (no velocity/mass simulation): each overlapping
  // pair is split exactly in half along X, which is what keeps it jitter-free — once the
  // overlap reaches 0 there's nothing left to correct, so it settles in a single frame instead
  // of oscillating. Two passes let 3+ players tangled in a knot untangle smoothly instead of
  // popping. Never touches vy/vx/attack state, so it can't affect combat, hitboxes or controls.
  var COLLIDE_HW = PW + 4; // a hair wider than the platform half-width so bodies visibly touch
  function resolvePlayerCollisions(ids) {
    for (var pass = 0; pass < 2; pass++) {
      for (var i = 0; i < ids.length; i++) {
        var a = players[ids[i]];
        if (!a || !a.alive) continue;
        for (var j = i + 1; j < ids.length; j++) {
          var b = players[ids[j]];
          if (!b || !b.alive) continue;
          var dx = b.x - a.x;
          var dy = b.y - a.y;
          var xOverlap = COLLIDE_HW * 2 - Math.abs(dx);
          var yOverlap = PH - Math.abs(dy);
          if (xOverlap <= 0 || yOverlap <= 0) continue;
          if (dx === 0) dx = ids[i] < ids[j] ? -0.01 : 0.01;
          var dir = dx > 0 ? 1 : -1;
          var half = xOverlap / 2;
          a.x -= dir * half;
          b.x += dir * half;
          a.x = clamp(a.x, 14, W - 14);
          b.x = clamp(b.x, 14, W - 14);
        }
      }
    }
  }

  /* ---------------------------------------------------------------- power orbs */
  // Four elemental pickups that spawn on the map during a fight. Touching one (just walking
  // into it, no button) grants an 8s power. Only one orb is ever live at a time — simple to
  // read on screen, simple to balance, nothing to track across rounds. Fuego/hielo don't do
  // anything to the wearer directly — they stamp a status on whoever the wearer *hits* while
  // the power is active; tierra/aire are plain stat modifiers on the wearer for those 8s.
  // Colors + all the aura/flash/recolor rendering for each power live in stickman.js
  // (POWER_COLORS, auraSegment, drawOrbitAura, drawBurnFlash) right next to the rig that draws
  // them — this file only owns the gameplay state (spawn/pickup/timers/damage), not how it looks.
  var ORB_TYPES = Object.keys(POWER_COLORS);
  var ORB_SPAWN_MS = 10000, ORB_POWER_MS = 8000, ORB_PICKUP_R = 28;
  var BURN_MS = 3000, BURN_TICK_MS = 500, BURN_DMG = 2;
  var SLOW_MS = 2500, SLOW_MULT = 0.5;
  var ARMOR_MULT = 0.5;
  var AIR_SPEED_MULT = 1.35, AIR_COOLDOWN_MULT = 0.55;

  var orb = null; // { type, x, y, bornT }
  var orbTimer = ORB_SPAWN_MS;

  function spawnOrb() {
    var plats = currentMap.platforms;
    var pl = plats[Math.floor(Math.random() * plats.length)];
    var pad = Math.min(24, pl.w / 3);
    var lo = pl.x + pad, hi = pl.x + pl.w - pad;
    var x = hi > lo ? lo + Math.random() * (hi - lo) : pl.x + pl.w / 2;
    var type = ORB_TYPES[Math.floor(Math.random() * ORB_TYPES.length)];
    orb = { type: type, x: x, y: pl.y - 30, bornT: 0 };
  }

  function updateOrbs(dt) {
    if (phase !== "fight") return;
    orbTimer -= dt;
    if (orbTimer <= 0) { spawnOrb(); orbTimer = ORB_SPAWN_MS; }
    if (!orb) return;
    orb.bornT += dt;
    for (var i = 0; i < roster.length; i++) {
      var p = players[roster[i]];
      if (!p || !p.alive) continue;
      var dx = p.x - orb.x, dy = (p.y - 20) - orb.y;
      if (dx * dx + dy * dy < ORB_PICKUP_R * ORB_PICKUP_R) {
        p.power = { type: orb.type, t: ORB_POWER_MS };
        AudioManager.on.uiClick();
        orb = null;
        break;
      }
    }
  }

  function drawOrb() {
    if (!orb) return;
    var color = POWER_COLORS[orb.type];
    var y = orb.y + (window.SNAIL_MODE ? 0 : Math.sin(orb.bornT * 0.004) * 4);
    ctx.save();
    ctx.fillStyle = color;
    if (!window.SNAIL_MODE) { ctx.shadowColor = color; ctx.shadowBlur = 14; }
    ctx.beginPath(); ctx.arc(orb.x, y, 10, 0, Math.PI * 2); ctx.fill();
    if (!window.SNAIL_MODE) ctx.shadowBlur = 0;
    ctx.restore();
  }

  /* ---------------------------------------------------------------- rey de la colina */
  function pickHillSpot() {
    var plats = currentMap.platforms;
    if (!plats.length) return null;
    var idx = Math.floor(Math.random() * plats.length);
    if (plats.length > 1 && idx === hillLastPlatformIdx) idx = (idx + 1) % plats.length;
    hillLastPlatformIdx = idx;
    var pl = plats[idx];
    return { x: pl.x + pl.w / 2, y: pl.y - 30, r: HILL_RADIUS };
  }

  function updateHill(dt) {
    if (phase !== "fight") return;
    hillTimer -= dt;
    if (hillTimer <= 0) { hill = pickHillSpot(); hillTimer = HILL_ACTIVE_MS; }
    if (!hill) return;

    for (var i = 0; i < roster.length; i++) {
      var p = players[roster[i]];
      if (!p || !p.alive) continue;
      var dx = p.x - hill.x, dy = (p.y - 20) - hill.y;
      if (dx * dx + dy * dy > hill.r * hill.r) continue;
      p.hillMs += dt;
      var newScore = Math.min(HILL_TARGET_SCORE, Math.floor(p.hillMs * (HILL_TARGET_SCORE / HILL_TARGET_MS)));
      if (newScore > (scores[p.id] || 0)) scores[p.id] = newScore;
      if (scores[p.id] >= HILL_TARGET_SCORE) { endMatch(); return; }
    }
  }

  function drawHill() {
    if (!hill) return;
    ctx.save();
    ctx.fillStyle = "rgba(255,194,71,.10)";
    ctx.strokeStyle = "rgba(255,194,71,.9)";
    ctx.lineWidth = 3;
    if (!window.SNAIL_MODE) { ctx.shadowColor = "rgba(255,194,71,.7)"; ctx.shadowBlur = 16; }
    ctx.beginPath();
    ctx.arc(hill.x, hill.y, hill.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  /* ---------------------------------------------------------------- rey del orbe */
  function updateOrbHold(dt) {
    if (phase !== "fight") return;
    orbkingTimer -= dt;
    for (var i = 0; i < roster.length; i++) {
      var p = players[roster[i]];
      if (!p || !p.alive || !p.power) continue;
      p.orbMs += dt;
      scores[p.id] = Math.floor(p.orbMs / 1000);
    }
    if (orbkingTimer <= 0) endMatch();
  }

  function drawMatchClock() {
    if (phase !== "fight" && phase !== "fightIntro") return;
    var totalSec = Math.max(0, Math.ceil(orbkingTimer / 1000));
    var mm = Math.floor(totalSec / 60), ss = totalSec % 60;
    ctx.save();
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.font = "bold 22px Chakra Petch, sans-serif";
    ctx.textAlign = "center";
    /* y=112, no 34: #topbar (avatares de colores, top:14px, 40px de alto) y #roundBanner
       (top:64px, visible todo el fight) están encima del canvas ahí arriba — a y=34 el reloj
       quedaba tapado por el primero. 112 despeja los dos con margen. */
    ctx.fillText(mm + ":" + (ss < 10 ? "0" : "") + ss, W / 2, 112);
    ctx.restore();
  }

  /* ---------------------------------------------------------------- physics */
  function stepPlayer(p, dt, damageEnabled) {
    if (!p.alive) {
      if (p.deathFadeT > 0) p.deathFadeT = Math.max(0, p.deathFadeT - dt);
      return;
    }
    var inLobby = phase === "lobby";
    // Every constant below (SPEED, GRAVITY_*, JUMP_V) is tuned as "pixels per frame at 60fps".
    // stepPlayer runs once per rendered frame, not once per fixed timestep, so without this
    // scale factor the simulation's actual speed is tied to whatever frame rate the device
    // happens to render at: capped to 24fps in snail mode, gravity only accumulates 24
    // times/sec instead of 60, so a jump hangs in the air ~2.5x longer in real time — moon
    // gravity — no matter how the constants themselves are tuned. Scaling every velocity/
    // position update by dt/16.6667 makes jump height AND hang time consistent regardless of
    // the device's real frame rate.
    var dtScale = dt / 16.6667;
    // aire speeds the wearer up; hielo (stamped on hit, not on the wearer) slows the victim
    // down — both are plain multipliers on the same SPEED constant, so neither touches the
    // base physics tuning.
    var speedMult = 1;
    if (p.power && p.power.type === "aire") speedMult *= AIR_SPEED_MULT;
    if (p.slowT > 0) speedMult *= SLOW_MULT;
    var spd = SPEED * speedMult;
    if (p.input.left && !p.input.right) { p.vx = -spd; p.facing = -1; }
    else if (p.input.right && !p.input.left) { p.vx = spd; p.facing = 1; }
    else p.vx = 0;

    if (p.jumpEdge && p.grounded) { p.vy = JUMP_V; p.grounded = false; p.jumpAnticT = 90; AudioManager.on.jump(); }
    p.jumpEdge = false;

    if ((p.punchEdge || p.kickEdge) && p.attackCooldown <= 0) {
      // punch/kick are two separate buttons now, each usable grounded or airborne — the
      // button picks the type directly instead of inferring it from p.grounded.
      var type = p.kickEdge ? "kick" : "punch";
      var dur = type === "kick" ? KICK_MS : PUNCH_MS;
      p.attack = { type: type, t: dur, dur: dur, hitSet: {} };
      var cdMult = (p.power && p.power.type === "aire") ? AIR_COOLDOWN_MULT : 1;
      p.attackCooldown = ATTACK_COOLDOWN * cdMult;
      AudioManager.on.swing(type);
    }
    p.punchEdge = false;
    p.kickEdge = false;

    p.vy += (p.vy < 0 ? GRAVITY_UP : GRAVITY_DOWN) * dtScale;
    var prevFeet = p.y;
    var wasGrounded = p.grounded;
    p.y += p.vy * dtScale;
    p.kbx = (p.kbx || 0) * Math.pow(0.88, dtScale);
    if (Math.abs(p.kbx) < 0.05) p.kbx = 0;
    p.x += (p.vx + p.kbx) * dtScale;
    p.x = Math.max(14, Math.min(W - 14, p.x));

    if (p.vx !== 0 && wasGrounded) p.walkCycle = ((p.walkCycle || 0) + dt * 0.0034) % 1;
    p.idleT += dt * 0.001;
    if (p.squash > 0) p.squash = Math.max(0, p.squash - dt * 0.006);
    if (p.jumpAnticT > 0) p.jumpAnticT = Math.max(0, p.jumpAnticT - dt);
    if (p.hitStunT > 0) p.hitStunT = Math.max(0, p.hitStunT - dt);
    if (p.deathFadeT > 0) p.deathFadeT = Math.max(0, p.deathFadeT - dt);
    if (p.burnFlashT > 0) p.burnFlashT = Math.max(0, p.burnFlashT - dt);

    if (p.power) { p.power.t -= dt; if (p.power.t <= 0) p.power = null; }
    if (damageEnabled && p.burnT > 0) {
      p.burnT -= dt;
      p.burnTickT -= dt;
      if (p.burnTickT <= 0) {
        p.hp -= BURN_DMG;
        p.burnTickT = BURN_TICK_MS;
        p.burnFlashT = 220; // re-pop the "just got burned" flash on every DoT tick, not just the hit
        if (p.hp <= 0) eliminate(p);
      }
    }
    if (p.slowT > 0) p.slowT = Math.max(0, p.slowT - dt);

    p.grounded = false;
    var plats = currentMap.platforms;
    for (var pi = 0; pi < plats.length; pi++) {
      var pl = plats[pi];
      if (p.vy >= 0 && prevFeet <= pl.y + 1 && p.y >= pl.y && p.x + PW > pl.x && p.x - PW < pl.x + pl.w) {
        p.y = pl.y;
        if (!wasGrounded && p.vy > 5) {
          p.squash = Math.min(1, p.vy / 14);
          var landStrength = clamp(p.vy / 14, 0, 1);
          Camera.addTrauma(landStrength * 0.22);
          if (!window.SNAIL_MODE) Particles.landingDust(p.x, p.y, p.facing, landStrength, "rgba(255,255,255,.55)");
          AudioManager.on.land(landStrength);
        }
        p.vy = 0; p.grounded = true;
      }
    }

    if (p.y > H + 60) {
      if (inLobby) { p.x = 100 + Math.random() * (W - 200); p.y = -40; p.vy = 0; p.vx = 0; }
      else if (damageEnabled) { eliminate(p); }
    }

    if (damageEnabled && p.alive && World.checkHazards(p, currentMap, PW)) { eliminate(p); }

    if (p.attack) {
      p.attack.t -= dt;
      if (damageEnabled) {
        for (var oi = 0; oi < roster.length; oi++) {
          var oid = roster[oi];
          if (oid === p.id) continue;
          var o = players[oid];
          if (!o || !o.alive || p.attack.hitSet[oid]) continue;
          var reach = p.attack.type === "kick" ? 44 : 34;
          var dx = o.x - p.x;
          var facingOk = p.facing > 0 ? (dx > -6 && dx < reach) : (dx < 6 && dx > -reach);
          var dy = Math.abs(o.y - p.y - 10);
          if (facingOk && dy < 60) {
            p.attack.hitSet[oid] = true;
            var dmg = p.attack.type === "kick" ? 16 : 10;
            if (o.power && o.power.type === "tierra") dmg = Math.round(dmg * ARMOR_MULT);
            var kbX = p.attack.type === "kick" ? 3.2 : 2.1;
            var kbY = p.attack.type === "kick" ? -2 : 0;
            o.hp -= dmg;
            if (p.power && p.power.type === "fuego") { o.burnT = BURN_MS; o.burnTickT = BURN_TICK_MS; o.burnFlashT = 220; }
            if (p.power && p.power.type === "hielo") o.slowT = SLOW_MS;
            o.kbx = (o.kbx || 0) + p.facing * kbX;
            o.vy += kbY;
            if (kbY < 0) o.grounded = false;

            var hitX = o.x, hitY = o.y - 14;
            var isKick = p.attack.type === "kick";
            HitStop.trigger(isKick ? 55 : 35);
            Camera.addTrauma(isKick ? 0.5 : 0.32);
            Camera.zoomImpulse(0.03);
            if (!window.SNAIL_MODE) Particles.punchSparks(hitX, hitY, p.facing, ac.getPlayerColor(p.id));
            ScreenFX.impactStreak(hitX, hitY, p.facing);
            AudioManager.on.hit(p.attack.type);
            // impact squash on the one who got hit, and a smaller recoil pop on the attacker —
            // both ride the same decaying squash field the landing impact already uses, so it's
            // free (no new state, no render cost) and settles itself out over the next ~150ms.
            o.squash = Math.max(o.squash || 0, isKick ? 0.55 : 0.4);
            p.squash = Math.max(p.squash || 0, 0.2);
            o.hitStunT = 180;
            o.hitDir = p.facing;

            if (o.hp <= 0) eliminate(o);
          }
        }
      }
      if (p.attack.t <= 0) p.attack = null;
    }
    if (p.attackCooldown > 0) p.attackCooldown -= dt;
  }

  /* ---------------------------------------------------------------- rendering */
  function drawMap(map, tMs, dt) {
    World.draw(ctx, W, H, map, Camera, tMs, dt);
  }

  function drawPlayer(p) {
    if (!p.alive && phase !== "lobby" && p.deathFadeT <= 0) return;
    var color = ac.getPlayerColor(p.id);

    // motion trail ghosts while an attack is in flight (Trails.draw is a no-op in snail mode,
    // so skip feeding it too — no point pushing snapshots nobody will render)
    if (p.attack && !window.SNAIL_MODE) {
      Trails.push(p, performance.now());
      Trails.draw(ctx, p, function (gctx, ghost) { drawStickman(gctx, ghost, color); });
    } else if (p._trail) {
      Trails.clear(p);
    }

    var fading = !p.alive && p.deathFadeT > 0;
    if (fading) ctx.globalAlpha = clamp(p.deathFadeT / 420, 0, 1);
    var rig = drawStickman(ctx, p, color);
    var headY = rig.headY;
    if (fading) { ctx.globalAlpha = 1; return; }

    // hp bar (only during fight/roundend)
    if (phase === "fight" || phase === "fightIntro" || phase === "roundEnd") {
      var bw = 40;
      ctx.fillStyle = "rgba(0,0,0,.5)";
      ctx.fillRect(p.x - bw / 2, headY - 24, bw, 5);
      ctx.fillStyle = color;
      ctx.fillRect(p.x - bw / 2, headY - 24, bw * Math.max(0, p.hp) / 100, 5);
    }

    // active-power indicator: a flat dot above the head, cheap enough to keep even in snail
    // mode (players need to know their own state) — only the glow around it is skipped there.
    // The aura/flash/recolor that actually SELLS each power (flame border, ice repaint, etc.)
    // is drawn by drawStickman itself, from the same p.power/burnT/slowT fields.
    if (p.power) {
      var pdef = POWER_COLORS[p.power.type];
      ctx.fillStyle = pdef;
      if (!window.SNAIL_MODE) { ctx.shadowColor = pdef; ctx.shadowBlur = 8; }
      ctx.beginPath(); ctx.arc(p.x, headY - 32, 4, 0, Math.PI * 2); ctx.fill();
      if (!window.SNAIL_MODE) ctx.shadowBlur = 0;
    }

    // nickname — text rasterization (font metrics + glyph fill) is surprisingly costly per
    // player per frame on weak TV engines; skip it in snail mode, the colored topbar avatars
    // already identify who's who.
    if (!window.SNAIL_MODE) {
      ctx.fillStyle = "rgba(255,255,255,.7)";
      ctx.font = "10px Chakra Petch, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(ac.getNickname(p.id), p.x, headY - 30);
    }

    /* Contador de puntos de Rey de la Colina / Rey del Orbe, arriba del nombre. Sin gate de
       snailMode: en estos modos es el marcador de la partida, no un adorno. */
    if (gameMode === "koth" || gameMode === "orbking") {
      ctx.fillStyle = gameMode === "koth" ? "rgba(255,194,71,.95)" : "rgba(157,255,79,.95)";
      ctx.font = "bold 11px Chakra Petch, sans-serif";
      ctx.textAlign = "center";
      var scoreTxt = gameMode === "koth" ? (scores[p.id] || 0) + " / " + HILL_TARGET_SCORE : (scores[p.id] || 0) + "s";
      ctx.fillText(scoreTxt, p.x, headY - 42);
    }
  }

  /* ---------------------------------------------------------------- main loop */
  var last = performance.now();
  var SNAIL_FRAME_MS = 1000 / 24; // caps render+step rate once engaged; rAF still fires at panel rate
  function loop(now) {
    if (window.SNAIL_MODE && now - last < SNAIL_FRAME_MS) {
      requestAnimationFrame(loop);
      return;
    }
    var realDt = Math.min(40, now - last);
    last = now;

    HitStop.update(realDt);
    var frozen = HitStop.active();
    var dt = frozen ? 0 : realDt;

    if (!frozen) {
      var damageEnabled = phase === "fight";
      var idsToStep = phase === "lobby" ? Object.keys(players) : roster;
      for (var si = 0; si < idsToStep.length; si++) stepPlayer(players[idsToStep[si]], dt, damageEnabled);
      resolvePlayerCollisions(idsToStep);
      updateOrbs(dt);
      if (gameMode === "koth") updateHill(dt);
      else if (gameMode === "orbking") updateOrbHold(dt);

      if (phase === "fightIntro") {
        phaseTimer -= dt;
        if (phaseTimer <= 0) {
          phase = "fight"; orbTimer = ORB_SPAWN_MS;
          if (gameMode === "koth") { hill = null; hillTimer = HILL_APPEAR_DELAY_MS; }
          else if (gameMode === "orbking") { orbkingTimer = ORBKING_MATCH_MS; }
          Camera.zoomImpulse(0.04); broadcastPhase(); AudioManager.on.fightBegin();
        }
      } else if (phase === "roundEnd") {
        phaseTimer -= dt;
        if (phaseTimer <= 0) nextRound();
      }

      Camera.update(dt);
      Particles.update(dt);
      ScreenFX.update(dt);
    }

    Camera.begin(ctx, W, H);
    drawMap(currentMap, now, dt);
    drawOrb();
    if (gameMode === "koth") drawHill();
    // plain for-loops here, not .forEach — a fresh closure allocated every single frame is
    // pure GC pressure with zero benefit, and this runs for every player every frame.
    if (phase === "lobby") {
      var lobbyIds = Object.keys(players);
      for (var li = 0; li < lobbyIds.length; li++) drawPlayer(players[lobbyIds[li]]);
    } else {
      for (var ri = 0; ri < roster.length; ri++) drawPlayer(players[roster[ri]]);
    }
    Particles.draw(ctx);
    Camera.end(ctx);

    if (gameMode === "orbking") drawMatchClock(); // relojito fijo en pantalla, no shakea con la cámara
    ScreenFX.drawVignette(ctx, W, H);
    ScreenFX.draw(ctx, W, H);

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---------------------------------------------------------------- SDK wiring */
  ac.onReady = function (code) {
    document.getElementById("roomCode").textContent = code || "----";
  };

  ac.onConnect = function (device_id) {
    if (phase === "lobby") { ensurePlayer(device_id); renderTopbar(); }
  };

  ac.onDisconnect = function (device_id) {
    if (players[device_id] && phase !== "lobby") {
      eliminate(players[device_id]);
    }
    if (phase === "lobby") { delete players[device_id]; renderTopbar(); }
  };

  ac.onMessage = function (device_id, data) {
    if (!data) return;
    if (data.t === "in") {
      var p = ensurePlayer(device_id);
      if (data.k === "left") p.input.left = data.d;
      if (data.k === "right") p.input.right = data.d;
      if (data.k === "jump" && data.d) p.jumpEdge = true;
      if (data.k === "punch" && data.d) p.punchEdge = true;
      if (data.k === "kick" && data.d) p.kickEdge = true;
      if (phase === "lobby") renderTopbar();
      return;
    }
    if (data.t === "snail" && device_id === ac.getMasterControllerDeviceId()) {
      window.SNAIL_MODE = !!data.on;
      return;
    }
    if (data.t === "start" && device_id === ac.getMasterControllerDeviceId() && phase === "lobby") {
      window.SNAIL_MODE = !!data.snail;
      startMatch(data.rounds, data.mode);
      return;
    }
    if (data.t === "restart" && device_id === ac.getMasterControllerDeviceId() && phase === "final") {
      resetToLobby();
      return;
    }
    if (data.t === "roundsPreview" && device_id === ac.getMasterControllerDeviceId() && phase === "lobby") {
      // Reenvía también el modo elegido: mismo canal "el host está configurando el lobby,
      // mantené a todos sincronizados" que ya existía para la cantidad de rondas.
      ac.broadcast({ t: "roundsPreview", n: data.n, mode: data.mode });
    }
    if (data.t === "syncRequest") {
      // A phone that was locked/backgrounded missed whatever "phase" broadcast fired while it
      // was asleep (e.g. the host started the match) — it reconnects to the same room but
      // never gets that push replayed, so it's stuck showing "esperando...". The controller
      // asks for a resync the moment its screen wakes up; answer with the current snapshot
      // targeted at just that device instead of waiting for the next natural broadcast.
      ac.message(device_id, phaseSnapshot());
      return;
    }
  };

  ac.onActivePlayersChange = function () {};
  renderTopbar();

  /* ---------------------------------------------------------------- audio panel */
  (function () {
    var s = AudioManager.getSettings();
    var sfxRange = document.getElementById("sfxRange");
    var musicRange = document.getElementById("musicRange");
    var masterRange = document.getElementById("masterRange");
    var muteBtn = document.getElementById("muteBtn");
    sfxRange.value = s.sfx;
    musicRange.value = s.music;
    masterRange.value = s.master;
    muteBtn.textContent = s.muted ? "ON" : "OFF";
    muteBtn.classList.toggle("active", s.muted);

    document.getElementById("audioToggle").addEventListener("click", function () {
      document.getElementById("audioMenu").classList.toggle("show");
    });
    sfxRange.addEventListener("input", function () { AudioManager.setSfxVolume(parseFloat(sfxRange.value)); });
    musicRange.addEventListener("input", function () { AudioManager.setMusicVolume(parseFloat(musicRange.value)); });
    masterRange.addEventListener("input", function () { AudioManager.setMasterVolume(parseFloat(masterRange.value)); });
    muteBtn.addEventListener("click", function () {
      var muted = !AudioManager.getSettings().muted;
      AudioManager.setMuted(muted);
      muteBtn.textContent = muted ? "ON" : "OFF";
      muteBtn.classList.toggle("active", muted);
    });
  })();
})();
</script>
</body>
</html>
